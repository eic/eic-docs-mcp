[project]
name = "eic-docs-mcp"
version = "0.1.0"
description = "MCP server for full-text search over EIC/ePIC documentation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12,<2",
    "pyyaml>=6.0",
]

[project.scripts]
eic-docs-mcp = "eic_docs_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eic_docs_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"sources.yaml" = "eic_docs_mcp/sources.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
